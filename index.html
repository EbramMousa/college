<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>نظام الكلية</title>
<style>
:root{--bg:#10131c;--card:#181c28;--tx:#efe8da;--mu:#9aa0b4;--ac:#f2b266;--on:#1a1206;--bd:#262b3b;--ok:#5cc08e;--bad:#ef6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4efe6;--card:#fffaf0;--tx:#231f18;--mu:#6f675a;--ac:#b8680f;--on:#fff;--bd:#e2d9c6;--ok:#2f8f5f;--bad:#c93c3c;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4efe6;--card:#fffaf0;--tx:#231f18;--mu:#6f675a;--ac:#b8680f;--on:#fff;--bd:#e2d9c6;--ok:#2f8f5f;--bad:#c93c3c;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:80px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:8px 14px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#stars{font-size:18px;overflow:hidden;white-space:nowrap}
#cnt{background:var(--ac);color:var(--on);border-radius:99px;padding:2px 12px;font-weight:700}
#off{font-size:12px;color:var(--bad)}
#strip{display:flex;gap:10px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none}
.mc{flex:0 0 auto;width:68px;text-align:center;font-size:12px}
.av{position:relative;width:68px;height:90px;border-radius:12px;overflow:hidden;border:2px solid var(--bd);transition:border-color .6s,box-shadow .6s}
.av img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.8) brightness(.55);transition:filter .8s;transform-origin:50% 100%}
.fx{position:absolute;inset:0;pointer-events:none;display:flex;justify-content:center;font-size:20px}
.mc .nm{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .bd{color:var(--mu);font-size:11px;font-variant-numeric:tabular-nums}
.mc[data-s=run] .av{border-color:var(--ok);box-shadow:0 0 12px rgba(92,192,142,.55)}
.mc[data-s=run] img{filter:none;animation:sway 3.2s ease-in-out infinite}
.mc[data-s=cheer] img,.mc[data-s=hype] img{filter:none;animation:hop .4s ease-in-out infinite}
.mc[data-s=cheer] .fx::after,.mc[data-s=hype] .fx::after{content:"✨"}
.mc[data-s=stretch] img{filter:none;animation:strc 3s ease-in-out infinite}
.mc[data-s=stretch] .fx::after{content:"🥱"}
.mc[data-s=idle] .fx::after{content:"💤";opacity:.8;animation:zz 3s ease-in-out infinite}
.mc.big{width:150px;margin:0 auto 8px;font-size:14px}.mc.big .av{width:150px;height:200px}.mc.big .bd{font-size:14px}
@keyframes sway{50%{transform:scale(1.03) rotate(.8deg)}}
@keyframes hop{50%{transform:translateY(-8px) scale(1.04)}}
@keyframes strc{50%{transform:scaleY(1.07) translateY(-2px)}}
@keyframes zz{50%{transform:translateY(-4px);opacity:.4}}
@keyframes pop{50%{transform:scale(1.25)}}.pop{animation:pop .4s}
.row2{display:flex;gap:10px;align-items:center}.row2 b{width:28px;text-align:center;font-size:18px}
.th{width:40px;height:52px;border-radius:8px;object-fit:cover}
.pk{width:52px;height:68px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}.pk.on{border-color:var(--ac)}
@media (prefers-reduced-motion:reduce){.mc img,.fx::after{animation:none!important}}
main{padding:12px 14px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
input,button,textarea{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=password],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);margin-bottom:8px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--on);font-weight:700;cursor:pointer}
button.g{background:var(--bd);color:var(--tx)}button.ok{background:var(--ok);color:#06140d}button.bad{background:var(--bad);color:#1c0707}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.task{display:flex;gap:10px;align-items:center}
.task .chk{flex:0 0 auto;width:40px;height:40px;padding:0;font-size:18px}
.task .t{flex:1;min-width:0}.mu{color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 0 8px;font-size:12px}
nav button.on{color:var(--ac)}nav button span{display:block;font-size:22px}
#clock{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
#say{text-align:center;margin:2px 0 8px}
.chips{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.chips button{background:var(--bd);color:var(--tx)}.chips button.on{background:var(--ac);color:var(--on)}
#rimg{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--bg)}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="top"><div id="stars"></div><span id="off" hidden>أوفلاين</span><div id="cnt">0 ⭐</div></div>
  <div id="strip"></div>
</header>
<main>
  <section id="s-tasks" class="on">
    <div class="card">
      <input type="text" id="tt" placeholder="المهمة">
      <input type="text" id="ts" placeholder="المادة (اختياري)">
      <input type="date" id="td">
      <button id="tadd" style="width:100%">أضف المهمة</button>
    </div>
    <div id="tl"></div>
    <button class="g" id="sum" style="width:100%">📋 انسخ ملخصي</button>
  </section>

  <section id="s-timer">
    <div id="me"></div>
    <div id="clock">25:00</div>
    <div id="say" class="mu"></div>
    <div class="chips"><button class="dur" data-m="15">15</button><button class="dur" data-m="25">25</button><button class="dur" data-m="50">50</button></div>
    <button id="tgo" style="width:100%;font-size:18px">ابدأ</button>
    <p class="mu" id="today" style="text-align:center"></p>
  </section>

  <section id="s-cur">
    <div class="card"><input type="text" id="sn" placeholder="اسم المادة"><button id="sadd" style="width:100%">أضف مادة</button></div>
    <div id="cl"></div>
    <h3>💡 الأفكار ← مشاريع</h3>
    <p class="mu">أقصى مشروعين شغالين، ولازم لكل فكرة أول خطوة صغيرة وتاريخ بداية.</p>
    <div class="card"><input type="text" id="it" placeholder="الفكرة"><input type="text" id="is" placeholder="أول خطوة (أقل من ساعة)"><input type="date" id="ib"><button id="iadd" style="width:100%">احفظ الفكرة</button></div>
    <div id="il"></div>
  </section>

  <section id="s-rev">
    <div class="card">
      <input type="text" id="rs" placeholder="المادة">
      <input type="file" id="rf" accept="image/*" multiple hidden>
      <button id="rup" style="width:100%">ارفع صور ملخصات</button>
      <p class="mu" id="rinfo"></p>
    </div>
    <div class="card" id="rcard" hidden>
      <img id="rimg" alt="">
      <p class="mu" id="rsub"></p>
      <div class="row"><button class="ok" id="rok">فاكر</button><button class="bad" id="rno">ناسي</button><button class="g" id="rdel">امسح</button></div>
    </div>
    <button class="g" id="rand" style="width:100%" hidden>راجع كارت عشوائي</button>
  </section>

  <section id="s-rank">
    <div class="card" id="champ" style="text-align:center;font-weight:700"></div>
    <div class="chips" id="gp"><button class="on" data-p="day">اليوم</button><button data-p="week">7 أيام</button><button data-p="month">الشهر</button></div>
    <div class="chips" id="gm"><button class="on" data-m="m">ساعات</button><button data-m="k">مهام</button><button data-m="p">نقاط</button></div>
    <div id="rk"></div>
    <details class="card"><summary>إعدادات الغرفة</summary>
      <input type="text" id="rn" placeholder="اسمك">
      <div class="chips" id="pick"></div>
      <input type="text" id="ru" placeholder="رابط Firebase Database (https://...firebasedatabase.app)">
      <input type="text" id="rr" placeholder="كود الغرفة (6 حروف أو أرقام على الأقل)">
      <div class="row"><button id="rsave">احفظ</button><button class="g" id="rgen">كود جديد</button></div>
      <div class="row"><button class="g" id="bk">نسخ احتياطي</button><button class="g" id="rs2">استرجاع</button></div>
      <p class="mu" id="rst"></p>
    </details>
  </section>

</main>
<nav>
  <button data-t="tasks" class="on"><span>✅</span>المهام</button>
  <button data-t="timer"><span>⏱️</span>تايمر</button>
  <button data-t="cur"><span>📘</span>المنهج</button>
  <button data-t="rev"><span>🧠</span>مراجعة</button>
  <button data-t="rank"><span>🏆</span>الترتيب</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const el=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);k.flat().forEach(c=>e.append(c));return e};
const today=()=>new Date().toLocaleDateString('en-CA');
const dueNum=d=>Math.round((Date.parse(d)-Date.parse(today()))/864e5);
let S={tasks:[],stars:0,mins:{},td:{},dur:25,timer:null,subs:[],ideas:[],uid:'',name:'',av:0,room:'',url:''};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('cs')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cs',JSON.stringify(S))}catch(e){}};
if(!S.uid){S.uid=Array.from({length:16},()=>Math.floor(Math.random()*36).toString(36)).join('');save()}
delete S.key;delete S.q;save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* tabs */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.t));
  if(b.dataset.t==='rev')renderRev();
  if(b.dataset.t==='cur'){renderCur();renderIdeas()}
  if(b.dataset.t==='rank'){renderBoard();poll()}
});

/* stars + character */
function renderStars(){const n=S.stars;$('#stars').textContent=('⭐'.repeat(Math.min(n,12))+(n>12?' +'+(n-12):''))||'—';$('#cnt').textContent=n+' ⭐'}
function chime(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='sine';o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(784,t);o.frequency.setValueAtTime(1047,t+.1);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start();o.stop(t+.42)}catch(e){}}
const SAY={idle:'مستنيك تبدأ',run:'بيذاكر... ركّز معاه',hype:'يلا بينا!',cheer:'برافو!',stretch:'وقت تمطّى سريع، افرد ضهرك'};
let temp=null,tempT=0,lastStr=null,lastSay='';
const curS=()=>temp||(S.timer?'run':'idle');
const pose=()=>tickRoom();
function flash(s,ms){temp=s;pose();clearTimeout(tempT);tempT=setTimeout(()=>{temp=null;pose()},ms)}
function celebrate(){
  flash('cheer',1700);
  setTimeout(()=>{S.stars++;save();renderStars();chime();const c=$('#cnt');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')},250);
}

/* tasks */
const dueLbl=l=>l<0?'🔴 متأخر '+(-l)+' يوم':l===0?'🟠 النهارده':l<=3?'🟠 باقي '+l+' يوم':'🟢 باقي '+l+' يوم';
function renderTasks(){
  const box=$('#tl');box.textContent='';
  const open=S.tasks.filter(t=>!t.done).sort((a,b)=>a.due<b.due?-1:1);
  if(!open.length)box.append(el('p',{className:'mu',textContent:'مفيش مهام مفتوحة. ضيف أول مهمة من فوق.'}));
  open.forEach(t=>{
    const b=el('button',{className:'chk',textContent:'✓',onclick:()=>{t.done=true;S.td[today()]=(S.td[today()]||0)+1;save();celebrate();poll();setTimeout(renderTasks,700)}});
    box.append(el('div',{className:'card task'},b,el('div',{className:'t'},el('div',{textContent:t.title}),el('div',{className:'mu',textContent:dueLbl(dueNum(t.due))+(t.sub?' · '+t.sub:'')}))));
  });
}
$('#td').value=today();
$('#tadd').onclick=()=>{
  const title=$('#tt').value.trim();if(!title)return;
  S.tasks.push({title,sub:$('#ts').value.trim(),due:$('#td').value||today(),done:false});
  $('#tt').value='';save();renderTasks();
};

/* timer + scene */
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function finish(ok){
  const t=S.timer;if(!t)return;
  const m=ok?t.dur:Math.floor((Date.now()-t.start)/60000);
  S.mins[today()]=(S.mins[today()]||0)+m;S.timer=null;save();poll();
  if(ok){celebrate();navigator.vibrate&&navigator.vibrate([200,100,200])}
  renderTimer();
}
function renderTimer(){
  const t=S.timer,run=!!t,left=run?(t.end-Date.now())/1000:S.dur*60;
  pose();
  if(run){const k=Math.floor((Date.now()-t.start)/600000);if(lastStr===null)lastStr=k;if(k>lastStr){lastStr=k;flash('stretch',6000)}}
  $('#clock').textContent=fmt(left);$('#tgo').textContent=run?'وقّف':'ابدأ';
  $('#today').textContent='مذاكرة النهارده: '+(S.mins[today()]||0)+' دقيقة';
  document.querySelectorAll('.dur').forEach(b=>b.classList.toggle('on',+b.dataset.m===S.dur));
  if(run&&left<=0)finish(true);
}
document.querySelectorAll('.dur').forEach(b=>b.onclick=()=>{if(!S.timer){S.dur=+b.dataset.m;save();renderTimer()}});
$('#tgo').onclick=()=>{
  if(S.timer)finish(false);
  else{const n=Date.now();S.timer={start:n,end:n+S.dur*60000,dur:S.dur};save();lastStr=null;flash('hype',1500);poll()}
  renderTimer();
};
setInterval(renderTimer,500);

/* review cards (images in IndexedDB) */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('cs',1);r.onupgradeneeded=()=>r.result.createObjectStore('img',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction('img',m),q=f(t.objectStore('img'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const putC=c=>tx('readwrite',s=>s.put(c)),allC=()=>tx('readonly',s=>s.getAll()),delC=id=>tx('readwrite',s=>s.delete(id));
async function shrink(f){
  const b=await createImageBitmap(f),k=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement('canvas');
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.8));
}
const DAYS=[0.01,1,3,7,14,30];
let cur=null,url=null;
function showCard(c){
  cur=c;$('#rcard').hidden=!c;
  if(!c)return;
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(c.blob);$('#rimg').src=url;$('#rsub').textContent=c.sub||'';
}
async function renderRev(){
  let cs=[];
  try{cs=await allC()}catch(e){$('#rinfo').textContent='التخزين مش متاح.';return}
  const due=cs.filter(c=>c.next<=Date.now()).sort((a,b)=>a.next-b.next);
  $('#rinfo').textContent=cs.length?cs.length+' كارت · '+due.length+' مستحق للمراجعة':'ارفع صور من ملخصاتك وهتتراجع على فترات.';
  $('#rand').hidden=!(cs.length&&!due.length);
  showCard(due[0]||null);
  $('#rand').onclick=()=>showCard(cs[Math.floor(Math.random()*cs.length)]);
}
$('#rup').onclick=()=>$('#rf').click();
$('#rf').onchange=async e=>{
  const sub=$('#rs').value.trim();
  for(const f of e.target.files){
    try{const blob=await shrink(f);await putC({id:Date.now()+'-'+Math.random().toString(36).slice(2),blob,sub,box:0,next:Date.now()})}catch(x){}
  }
  e.target.value='';renderRev();
};
async function grade(ok){
  if(!cur)return;
  cur.box=ok?Math.min(cur.box+1,5):0;
  cur.next=Date.now()+(ok?DAYS[cur.box]*864e5:600000);
  await putC(cur);if(ok)celebrate();renderRev();
}
$('#rok').onclick=()=>grade(true);$('#rno').onclick=()=>grade(false);
$('#rdel').onclick=async()=>{if(cur&&confirm('تمسح الكارت ده؟')){await delC(cur.id);renderRev()}};

function net(){$('#off').hidden=navigator.onLine;if(navigator.onLine)poll()}
addEventListener('online',net);addEventListener('offline',net);

/* room: live status + leaderboard (Firebase Realtime Database over REST) */
let R={},per='day',met='m';
const pic=(i,cls)=>el('img',{className:cls||'',src:'c'+(i||0)+'.webp',alt:'',decoding:'async',onerror(){this.onerror=null;this.src='icon-192.png'}});
const base=()=>/^https:\/\//.test(S.url)&&S.room.length>=6?S.url+'/rooms/'+S.room:'';
const members=()=>{const o=Object.assign({},R.members||{});o[S.uid]={n:S.name||'أنا',a:S.av,st:S.timer?{s:S.timer.start,e:S.timer.end}:null};return o};
function card(id,m,big){
  const d=el('div',{className:'mc'+(big?' big':'')});d.dataset.uid=id;
  d.append(el('div',{className:'av'},pic(m.a),el('span',{className:'fx'})),el('div',{className:'nm',textContent:m.n||'؟'}),el('div',{className:'bd'}));
  return d;
}
function renderRoom(){
  const m=members(),box=$('#strip');box.textContent='';
  Object.keys(m).sort((a,b)=>a===S.uid?-1:b===S.uid?1:0).forEach(id=>box.append(card(id,m[id])));
  const me=$('#me');me.textContent='';me.append(card(S.uid,m[S.uid],true));
  tickRoom();
}
function tickRoom(){
  const m=members();
  document.querySelectorAll('.mc').forEach(c=>{
    const id=c.dataset.uid,x=m[id];if(!x)return;
    const run=!!(x.st&&x.st.e>Date.now()),s=id===S.uid?curS():run?'run':'idle';
    if(c.dataset.s!==s)c.dataset.s=s;
    c.querySelector('.bd').textContent=run?'📖 '+fmt((Date.now()-x.st.s)/1000):'💤';
  });
  const s=curS();if(lastSay!==s){lastSay=s;$('#say').textContent=SAY[s]}
}
async function push(){
  const b=base();if(!b)return;const d=today();
  await fetch(b+'/members/'+S.uid+'.json',{method:'PUT',body:JSON.stringify({n:S.name||'أنا',a:S.av,st:S.timer?{s:S.timer.start,e:S.timer.end}:null,t:Date.now()})});
  await fetch(b+'/days/'+d+'/'+S.uid+'.json',{method:'PUT',body:JSON.stringify({m:S.mins[d]||0,k:S.td[d]||0})});
}
let polling=false;
async function poll(){
  const b=base();
  if(!b){$('#rst').textContent='اضبط رابط وكود الغرفة عشان تشوف أصحابك.';return}
  if(polling||!navigator.onLine)return;polling=true;
  try{
    await push();
    const t=new Date(),w=new Date(t);w.setDate(w.getDate()-6);const mo=iso(t).slice(0,8)+'01',since=iso(w)<mo?iso(w):mo;
    const [a,c]=await Promise.all([fetch(b+'/members.json'),fetch(b+'/days.json?orderBy='+encodeURIComponent('"$key"')+'&startAt='+encodeURIComponent('"'+since+'"'))]);
    if(!a.ok||!c.ok)throw new Error('x');
    R={members:(await a.json())||{},days:(await c.json())||{}};$('#rst').textContent='متصل ✅';
    renderRoom();renderBoard();
  }catch(e){$('#rst').textContent='مش قادر يتصل بالغرفة (اتأكد من الرابط والقواعد).'}
  polling=false;
}
const iso=d=>d.toLocaleDateString('en-CA');
function renderBoard(){
  const t=new Date(),e=iso(t);let s=e;
  if(per==='week'){const d=new Date(t);d.setDate(d.getDate()-6);s=iso(d)}
  if(per==='month')s=e.slice(0,8)+'01';
  const mem=members(),tot={},days=R.days||{};
  Object.keys(mem).forEach(id=>tot[id]={m:0,k:0});
  for(const d in days){if(d<s||d>e)continue;for(const id in days[d]){if(id===S.uid)continue;if(!tot[id])tot[id]={m:0,k:0};tot[id].m+=days[d][id].m||0;tot[id].k+=days[d][id].k||0}}
  for(const d in S.mins)if(d>=s&&d<=e)tot[S.uid].m+=S.mins[d];
  for(const d in S.td)if(d>=s&&d<=e)tot[S.uid].k+=S.td[d];
  const rows=Object.keys(tot).map(id=>({id,n:(mem[id]||{}).n||'؟',a:(mem[id]||{}).a||0,m:tot[id].m,k:tot[id].k,p:tot[id].m+tot[id].k*10}));
  rows.sort((a,b)=>b[met]-a[met]);
  const box=$('#rk');box.textContent='';
  rows.forEach((r,i)=>box.append(el('div',{className:'card row2'},el('b',{textContent:i===0&&r[met]>0?'👑':String(i+1)}),pic(r.a,'th'),el('div',{className:'t'},el('div',{textContent:r.n+(r.id===S.uid?' (أنت)':'')}),el('div',{className:'mu',textContent:(r.m/60).toFixed(1)+' ساعة · '+r.k+' مهمة · '+r.p+' نقطة'})))));
  $('#champ').textContent=rows.length&&rows[0][met]>0?'👑 البطل: '+rows[0].n:'لسه مفيش بطل، ابدأ مذاكرة!';
}
function group(id,attr,set){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));set(b.dataset[attr]);renderBoard()})}
group('gp','p',v=>per=v);group('gm','m',v=>met=v);
function renderPick(){const p=$('#pick');p.textContent='';for(let i=0;i<8;i++)p.append(Object.assign(pic(i,'pk'+(S.av===i?' on':'')),{onclick:()=>{S.av=i;save();renderPick();renderRoom();poll()}}))}
$('#rn').value=S.name;$('#ru').value=S.url;$('#rr').value=S.room;renderPick();
$('#rgen').onclick=()=>{$('#rr').value=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6)};
$('#rsave').onclick=()=>{
  S.name=$('#rn').value.trim().slice(0,20);
  S.url=$('#ru').value.trim().replace(/\/+$/,'');
  S.room=$('#rr').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
  save();renderRoom();renderBoard();poll();
};
setInterval(()=>{if(!document.hidden)poll()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

/* curriculum + ideas + summary + backup */
const ST=['لم يبدأ','اتشرح','اتذاكر','اتراجع'],IS=['فكرة','شغال','خلص','متأجل'],MAXA=2,openSub=new Set();
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function renderCur(){
  const box=$('#cl');box.textContent='';
  if(!S.subs.length)box.append(el('p',{className:'mu',textContent:'ضيف مادة، وبعدين الصق موضوعاتها (كل موضوع في سطر).'}));
  S.subs.forEach(sb=>{
    const n=sb.topics.length,score=n?sb.topics.reduce((a,t)=>a+t.s,0)/(3*n):0,nxt=sb.topics.find(t=>t.s===0);
    const d=el('details',{className:'card',open:openSub.has(sb.id)});
    d.addEventListener('toggle',()=>{d.open?openSub.add(sb.id):openSub.delete(sb.id)});
    d.append(el('summary',{textContent:sb.name+' · '+Math.round(score*100)+'%'+(nxt?' · التالي: '+nxt.t:'')}),el('progress',{max:1,value:score,style:'width:100%;margin:6px 0'}));
    const ta=el('textarea',{rows:3,placeholder:'موضوعات (كل موضوع في سطر)'});
    d.append(ta,el('button',{textContent:'أضف الموضوعات',onclick:()=>{ta.value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(t=>sb.topics.push({t,s:0}));save();renderCur()}}));
    sb.topics.forEach(t=>d.append(el('div',{className:'row2',style:'margin-top:6px'},el('div',{className:'t',style:'flex:1;'+(t.s===3?'opacity:.5':''),textContent:t.t}),el('button',{className:'g',textContent:ST[t.s],onclick:()=>{t.s=(t.s+1)%4;save();if(t.s===3)celebrate();renderCur()}}))));
    d.append(el('button',{className:'bad',style:'margin-top:8px',textContent:'امسح المادة',onclick:()=>{if(confirm('تمسح المادة وكل موضوعاتها؟')){S.subs=S.subs.filter(x=>x!==sb);save();renderCur()}}}));
    box.append(d);
  });
}
$('#sadd').onclick=()=>{const n=$('#sn').value.trim();if(!n)return;const sb={id:nid(),name:n,topics:[]};S.subs.push(sb);openSub.add(sb.id);$('#sn').value='';save();renderCur()};
function renderIdeas(){
  const box=$('#il');box.textContent='';
  S.ideas.filter(x=>x.st!==2).sort((a,b)=>a.by<b.by?-1:1).forEach(x=>{
    const late=x.st===0&&dueNum(x.by)<0;
    const sel=el('select',{},IS.map((l,i)=>el('option',{value:i,textContent:l,selected:i===x.st})));
    sel.onchange=()=>{const v=+sel.value;if(v===1&&S.ideas.filter(y=>y.st===1&&y!==x).length>=MAXA){alert('عندك '+MAXA+' مشاريع شغالة. خلّص واحد الأول.');sel.value=x.st;return}x.st=v;save();if(v===2)celebrate();renderIdeas()};
    box.append(el('div',{className:'card'},el('div',{textContent:(late?'⚠️ ':'')+x.title}),el('div',{className:'mu',textContent:'أول خطوة: '+x.step+' · قبل '+x.by+(late?' (عدّى الميعاد: ابدأ أو أجّل)':'')}),sel));
  });
}
$('#ib').value=today();
$('#iadd').onclick=()=>{const title=$('#it').value.trim(),step=$('#is').value.trim();if(!title||!step){alert('اكتب الفكرة وأول خطوة ليها.');return}S.ideas.push({id:nid(),title,step,by:$('#ib').value||today(),st:0});$('#it').value=$('#is').value='';save();renderIdeas()};
$('#sum').onclick=async()=>{
  const open=S.tasks.filter(t=>!t.done).sort((a,b)=>a.due<b.due?-1:1).map(t=>'- '+t.title+(t.sub?' ('+t.sub+')':'')+' — '+t.due+' ('+dueNum(t.due)+' يوم)').join('\n')||'مفيش';
  const cur=S.subs.map(s=>'- '+s.name+': '+(s.topics.length?Math.round(s.topics.reduce((a,t)=>a+t.s,0)/(3*s.topics.length)*100):0)+'%').join('\n')||'-';
  try{await navigator.clipboard.writeText('مهامي المفتوحة:\n'+open+'\n\nتقدم المنهج:\n'+cur+'\n\nمذاكرة النهارده: '+(S.mins[today()]||0)+' دقيقة');$('#sum').textContent='اتنسخ ✅'}catch(e){$('#sum').textContent='النسخ مش متاح'}
  setTimeout(()=>$('#sum').textContent='📋 انسخ ملخصي',2000);
};
$('#bk').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));$('#rst').textContent='اتنسخت النسخة الاحتياطية، احفظها في مكان آمن.'}catch(e){$('#rst').textContent='النسخ مش متاح'}};
$('#rs2').onclick=()=>{const t=prompt('الصق النسخة الاحتياطية هنا');if(!t)return;try{const o=JSON.parse(t);if(!o.uid)throw 0;if(confirm('ده هيستبدل بياناتك الحالية. تكمل؟')){S=Object.assign(S,o);delete S.key;delete S.q;save();location.reload()}}catch(e){alert('النسخة مش صالحة')}};

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
renderStars();renderTasks();renderRoom();renderTimer();renderCur();renderIdeas();renderBoard();net();poll();
</script>
</body>
